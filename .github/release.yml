# Configuration for GitHub's automatically generated release notes
# (https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes).
#
# Used whenever "Generate release notes" is invoked on a GitHub Release —
# merged PRs are grouped into Keep a Changelog-style sections by their labels.
# The per-package CHANGELOG.md files are still written by changesets from the
# changeset summaries (see docs/versioning.md); this config shapes the
# repo-level release notes on the Releases page.
#
# Note: this is NOT .github/workflows/release.yml (the publish workflow) —
# same name, different file, different job.

changelog:
  exclude:
    labels:
      - automated
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
        - 'semver:major'
    - title: Added
      labels:
        - enhancement
    - title: Fixed
      labels:
        - bug
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
        - github-actions
    - title: Changed
      labels:
        - '*'
