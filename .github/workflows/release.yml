name: Release

on:
  push:
    branches: [main]
  # Dispatched by version-bump.yml after it pushes an auto-generated changeset
  # (GITHUB_TOKEN pushes don't trigger `on: push` runs).
  workflow_dispatch:

# Only one release run at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never attempt to version or publish from forks.
    if: github.repository == 'marble-sh/backstage-plugins-grafana'
    permissions:
      contents: write # create the "Version Packages" PR and tags
      pull-requests: write # open/update the release PR
      id-token: write # npm publish provenance
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # When changesets exist, this opens/updates a "Version Packages" PR.
      # When there are none (that PR was merged), it publishes to npm.
      # Note: pinned to v1 — changesets/action v2 requires @changesets/cli v3.
      - name: Create release PR or publish
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: yarn release:version
          publish: yarn release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
