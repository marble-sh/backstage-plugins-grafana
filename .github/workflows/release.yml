name: Release

on:
  push:
    branches: [main]
  # Dispatched by version-bump.yml after it pushes an auto-generated changeset
  # (GITHUB_TOKEN pushes don't trigger `on: push` runs).
  workflow_dispatch:

# Only one release run at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never attempt to version or publish from forks.
    if: github.repository == 'marble-sh/backstage-plugins-grafana'
    permissions:
      contents: write # create the "Version Packages" PR and tags
      pull-requests: write # open/update the release PR
      id-token: write # npm publish provenance
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/
          cache: yarn

      - name: Update NPM
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --immutable

      # When changesets exist, this opens/updates a "Version Packages" PR.
      # When there are none (that PR was merged), it publishes to npm.
      # Note: action v2 pairs with @changesets/cli v3 — bump them together.
      # The action exports CHANGESETS_OUTPUT to the publish script; the
      # trailing `changeset git-tag` in release:publish writes the events the
      # action reads to create the git tags and GitHub releases.
      - name: Create release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          version-script: yarn release:version
          publish-script: yarn release:publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'
