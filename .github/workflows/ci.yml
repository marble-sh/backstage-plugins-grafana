name: CI

on:
  pull_request:
  push:
    branches: [main]

# The default token only ever needs to read the repo contents.
permissions:
  contents: read

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=8192
      # Native DB tests run against in-memory SQLite; never reach for Docker.
      BACKSTAGE_TEST_DISABLE_DOCKER: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so lint/version tooling can diff against main.
          fetch-depth: 0

      # Corepack must be enabled before setup-node so the yarn cache resolves
      # against the pinned Yarn 4, not the runner's preinstalled Yarn 1.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check package metadata
        run: yarn fix:check

      - name: Prettier
        run: yarn prettier:check

      - name: Lint
        run: yarn lint:all

      - name: Type check
        run: yarn tsc:full

      - name: Validate API reports
        run: yarn build:api-reports --ci

      - name: Build all packages
        run: yarn build:all

      - name: Test
        run: yarn test:all

      - name: Ensure clean working directory
        run: |
          if files=$(git ls-files --exclude-standard --others --modified) && [[ -n "$files" ]]; then
            echo "CI modified or created files that are not checked in:"
            echo "$files"
            git diff
            exit 1
          fi
